<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Office Jukebox</title>
<style>
  :root {
    --bg: #f4f5f2; --card: #ffffff; --text: #16181a; --muted: #6b7075; --line: #e3e5e0;
    --accent: #12a150; --accent-text: #ffffff; --danger: #c43c3c; --shadow: 0 1px 2px rgba(0,0,0,.05), 0 8px 24px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1112; --card: #181b1d; --text: #eef0ee; --muted: #98a09c; --line: #2a2e30;
      --accent: #1ed760; --accent-text: #08130c; --danger: #ff7373; --shadow: none; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
  main { max-width: 1000px; margin: 0 auto; padding: 24px 16px 48px; display: grid; grid-template-columns: minmax(0, 1fr); column-gap: 20px; }
  main > .col { min-width: 0; }
  @media (min-width: 880px) {
    main { grid-template-columns: minmax(0, 520px) minmax(0, 1fr); }
    main > header { grid-column: 1 / -1; }
    #chatCard { position: sticky; top: 16px; align-self: start; }
  }
  .chatlog { height: 360px; overflow-y: auto; display: flex; flex-direction: column; gap: 7px; padding-right: 4px; margin-bottom: 10px; overscroll-behavior: contain; }
  @media (max-width: 879px) { .chatlog { height: 260px; } }
  .cm { font-size: 14px; line-height: 1.45; overflow-wrap: anywhere; }
  .cm b { font-weight: 650; margin-right: 4px; }
  .cm.host b { color: var(--accent); }
  .cm.mine b::after { content: " (you)"; font-weight: 400; color: var(--muted); }
  .cm time { color: var(--muted); font-size: 11px; margin-left: 6px; font-variant-numeric: tabular-nums; }
  .cm.system { color: var(--muted); font-size: 13px; text-align: center; }
  .chathead { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .chathead h2 { margin: 0; }
  .live { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 650; padding: 5px 11px; border-radius: 999px;
    background: var(--line); color: var(--muted); max-width: 100%; }
  .live .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; }
  .live.on { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }
  .live .names { font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  @media (prefers-reduced-motion: no-preference) {
    .live.on .dot { animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.7); } }
  }
  .cm .ear { display: none; font-size: 11px; font-weight: 600; color: var(--accent); margin-right: 6px;
    background: color-mix(in srgb, var(--accent) 16%, transparent); padding: 1px 6px; border-radius: 999px; }
  .cm.listening .ear { display: inline-block; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: -.01em; }
  .pill { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--line); color: var(--muted); }
  .pill.live { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; box-shadow: var(--shadow); margin-bottom: 14px; }
  .now { display: grid; grid-template-columns: 96px 1fr; gap: 14px; align-items: center; }
  .art { width: 96px; height: 96px; border-radius: 10px; background: var(--line) center/cover; }
  .title { font-weight: 650; font-size: 17px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .artist { color: var(--muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar { height: 4px; background: var(--line); border-radius: 4px; margin-top: 10px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .5s linear; }
  .times { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 11px 16px; cursor: pointer;
    background: var(--accent); color: var(--accent-text); }
  button.secondary { background: var(--line); color: var(--text); }
  button:disabled { opacity: .45; cursor: default; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
  .controls button { width: 100%; }
  button.voted { outline: 2px solid var(--accent); outline-offset: -2px; }
  .reqby { font-size: 13px; color: var(--accent); margin-top: 2px; }
  .votehint { font-size: 12px; color: var(--muted); text-align: center; margin: 8px 0 0; }
  li.q { grid-template-columns: 44px 1fr auto; }
  button.remove { padding: 6px 10px; font-size: 13px; background: transparent; color: var(--danger); border: 1px solid var(--line); }
  label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin: 0 0 6px; }
  input { width: 100%; font: inherit; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  .row { display: flex; gap: 8px; }
  .row input { flex: 1; min-width: 0; }
  .field { margin-bottom: 12px; }
  .hint { font-size: 13px; color: var(--muted); margin: 8px 0 0; }
  .msg { font-size: 14px; margin: 10px 0 0; min-height: 1.2em; }
  .msg.err { color: var(--danger); } .msg.ok { color: var(--accent); }
  h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; }
  ol { list-style: none; padding: 0; margin: 0; }
  li { display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
  li:first-child { border-top: 0; }
  li .thumb { width: 44px; height: 44px; border-radius: 6px; background: var(--line) center/cover; }
  li .by { font-size: 13px; color: var(--muted); }
  .empty { color: var(--muted); font-size: 14px; }
  .results { list-style: none; padding: 0; margin: 8px 0 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .results:empty { display: none; }
  .results li { grid-template-columns: 44px 1fr auto; padding: 8px 10px; border-top: 1px solid var(--line); }
  .results li:first-child { border-top: 0; }
  .results button { padding: 7px 12px; font-size: 14px; }
  .listen { display: flex; align-items: center; gap: 12px; }
  .listen button { min-width: 116px; }
  .listen input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); padding: 0; border: 0; background: none; }
  #listenCard[hidden] { display: none; }
  .offline { text-align: center; padding: 32px 16px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="heading">Office Jukebox</h1>
    <span id="status" class="pill">Connecting…</span>
  </header>
  <div class="col">

  <section class="card" id="nowCard">
    <div class="now">
      <div class="art" id="art"></div>
      <div style="min-width:0">
        <div class="title" id="title">Nothing playing</div>
        <div class="artist" id="artist">&nbsp;</div>
        <div class="reqby" id="reqby"></div>
        <div class="bar"><i id="progress"></i></div>
        <div class="times"><span id="pos">0:00</span><span id="dur">0:00</span></div>
      </div>
    </div>
    <div class="controls">
      <button class="secondary" id="toggleBtn">⏸ Pause</button>
      <button class="secondary" id="nextBtn">⏭ Next</button>
    </div>
    <p class="votehint" id="votehint"></p>
  </section>

  <section class="card" id="listenCard" hidden>
    <div class="listen">
      <button id="listenBtn">🎧 Listen</button>
      <input type="range" id="vol" min="0" max="1" step="0.01" value="0.8" aria-label="Volume">
    </div>
    <p class="hint" id="listenHint">Hear the music right here — runs a few seconds behind.</p>
    <p class="hint" id="listeners"></p>
  </section>

  <section class="card" id="requestCard">
    <div class="field">
      <label for="name">Your name <span style="font-weight:400">(optional)</span></label>
      <input id="name" maxlength="24" placeholder="Shown next to your songs and messages" autocomplete="nickname">
    </div>
    <label for="url">Request a song</label>
    <form class="row" id="form">
      <input id="url" placeholder="Paste a Spotify song link" autocomplete="off" enterkeyhint="search">
      <button type="submit" id="addBtn">Add</button>
    </form>
    <ol class="results" id="results" aria-label="Search results"></ol>
    <p class="hint" id="hint">In Spotify: ⋯ on a song → Share → Copy song link.</p>
    <p class="msg" id="msg" role="status"></p>
  </section>

  <section class="card">
    <h2>Up next</h2>
    <ol id="queue"><li class="empty" style="display:block">No requests yet — add one!</li></ol>
  </section>
  </div>

  <aside class="card" id="chatCard" hidden aria-label="Chat">
    <div class="chathead">
      <h2>Chat</h2>
      <span class="live" id="chatLive" title=""><span class="dot" aria-hidden="true"></span><span id="chatLiveText">🎧 0 listening</span></span>
    </div>
    <div class="chatlog" id="chatlog" aria-live="polite"><div class="cm system" id="chatEmpty">No messages yet — say hi.</div></div>
    <form class="row" id="chatForm">
      <input id="chatText" maxlength="280" placeholder="Say something…" autocomplete="off" enterkeyhint="send" aria-label="Message">
      <button type="submit" id="chatSend">Send</button>
    </form>
    <p class="msg" id="chatMsg" role="status"></p>
  </aside>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  let state = null, fetchedAt = 0, failures = 0;
  let audio = null, hls = null, vol = 0.8, beatTimer = 0;
  const beat = () => post("api/listening", { name: $("name").value }).then(refresh).catch(() => {});

  // Two ways this page runs: served by MixMic through the tunnel (API is relative), or from GitHub Pages
  // with the secret after "#" — then we look up MixMic's current tunnel address in the repo's tunnel.json.
  const SECRET = location.hash.length > 1 ? location.hash.slice(1).replace(/[^a-z0-9]/gi, "") : "";
  let API = "", lastResolve = 0;
  async function resolveAPI() {
    if (!SECRET) return true;
    lastResolve = Date.now();
    const owner = location.hostname.split(".")[0];
    const seg = location.pathname.split("/").filter(Boolean)[0];
    const repo = location.hostname.endsWith(".github.io") ? (seg || location.hostname) : location.hostname;
    const sources = [
      [`https://api.github.com/repos/${owner}/${repo}/contents/tunnel.json`, { Accept: "application/vnd.github.raw+json" }],
      [`https://raw.githubusercontent.com/${owner}/${repo}/HEAD/tunnel.json?t=${Date.now()}`, {}],
      [`tunnel.json?t=${Date.now()}`, {}],
    ];
    for (const [url, headers] of sources) {
      try {
        const r = await fetch(url, { cache: "no-store", headers });
        if (!r.ok) continue;
        const j = await r.json();
        if (j.url && /^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/.test(j.url)) { API = j.url + "/" + SECRET + "/"; return true; }
        API = ""; return false; // MixMic published that it's offline
      } catch (e) {}
    }
    return false;
  }
  // Private ID for this browser, so you can remove songs you added (and nobody else can).
  const client = (() => {
    const fresh = () => (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now());
    try { let c = localStorage.getItem("jbClient"); if (!c) { c = fresh(); localStorage.setItem("jbClient", c); } return c; }
    catch (e) { return fresh(); }
  })();

  try { $("name").value = localStorage.getItem("jbName") || ""; } catch (e) {}
  $("name").addEventListener("change", () => { try { localStorage.setItem("jbName", $("name").value); } catch (e) {} });

  const fmt = (s) => { s = Math.max(0, Math.floor(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const safeUrl = (u) => /^https:\/\/[^\s"'()]+$/.test(u || "") ? u : "";

  function say(text, kind) { const m = $("msg"); m.textContent = text; m.className = "msg " + (kind || ""); }

  async function refresh() {
    try {
      if (SECRET && !API) throw new Error("offline");
      const r = await fetch(API + "api/state", { cache: "no-store", headers: { "X-Client": client } });
      if (!r.ok) throw new Error();
      state = await r.json(); fetchedAt = Date.now(); failures = 0;
      render();
    } catch (e) {
      if (SECRET && Date.now() - lastResolve > 30000) resolveAPI(); // MixMic may have restarted with a new address
      if (++failures >= 3) {
        $("status").textContent = "Offline"; $("status").className = "pill";
        $("title").textContent = "The jukebox is offline"; $("artist").textContent = "Its owner may have closed MixMic.";
      }
    }
  }

  function render() {
    if (!state) return;
    const host = state.host ? state.host + "'s Jukebox" : "Office Jukebox";
    $("heading").textContent = host; document.title = host;
    const n = state.now;
    $("status").textContent = n && n.state === "playing" ? "Playing" : "Paused";
    $("status").className = "pill" + (n && n.state === "playing" ? " live" : "");
    $("title").textContent = n ? n.title : "Nothing playing";
    $("artist").textContent = n ? n.artist : "";
    const art = safeUrl(n && n.artwork);
    $("art").style.backgroundImage = art ? `url("${art}")` : "";
    const v = state.votes || { needed: 1, next: 0, toggle: 0 };
    const playing = n && n.state === "playing";
    const need = v.needed > 1;
    $("reqby").textContent = state.requestedBy ? "Requested by " + state.requestedBy
      : state.playlist ? `From ${state.playlist.by}'s ${state.playlist.kind}: ${state.playlist.title}` : "";
    $("toggleBtn").textContent = (playing ? "⏸ Pause" : "▶ Resume") + (need && v.toggle ? ` ${v.toggle}/${v.needed}` : "");
    $("toggleBtn").disabled = !state.pause || !n || v.votedToggle;
    $("toggleBtn").classList.toggle("voted", !!v.votedToggle);
    $("nextBtn").textContent = v.cooldown > 0 ? `⏳ ${fmt(v.cooldown)}` : "⏭ Next" + (need && v.next ? ` ${v.next}/${v.needed}` : "");
    $("nextBtn").disabled = !state.next || v.votedNext || v.cooldown > 0;
    $("nextBtn").classList.toggle("voted", !!v.votedNext);
    $("votehint").textContent = v.cooldown > 0 ? `You've voted to skip ${(state.limits && state.limits.skipLimit) || 3} times — skipping is paused for you for a bit.`
      : need ? `${v.needed} people need to vote to skip or pause.` : "";
    $("url").disabled = $("addBtn").disabled = !state.requests;
    $("url").placeholder = !state.requests ? "Requests are paused right now"
      : state.search ? "Search a song, or paste a song or playlist link" : "Paste a Spotify song or playlist link";
    $("addBtn").textContent = state.search ? "Search" : "Add";
    $("hint").textContent = state.search ? "Type a song or artist and tap Add — or paste a playlist link to queue a whole playlist."
      : "In Spotify: ⋯ → Share → Copy link. Songs and playlists both work.";

    $("listenCard").hidden = !state.broadcast;
    if (!state.broadcast && audio) stopListening("The broadcast has ended.");
    else if (!audio) $("listenHint").textContent = state.streamReady
      ? "Hear the music right here — runs a few seconds behind."
      : "The broadcast is starting…";
    $("listenBtn").disabled = !audio && !state.streamReady;
    const who = state.listening || [];
    $("listeners").textContent = who.length ? `🎧 ${who.length} listening: ${who.join(", ")}` : "No one's listening yet.";
    // Live counter in the chat header, and 🎧 badges next to listeners' names in the chat.
    $("chatLive").classList.toggle("on", who.length > 0);
    $("chatLive").title = who.join(", ");
    $("chatLiveText").innerHTML = who.length
      ? `🎧 ${who.length} listening${who.length <= 3 ? ` <span class="names">· ${esc(who.join(", "))}</span>` : ""}`
      : "🎧 0 listening";
    listeningTags = new Set((state.listeningTags || []).filter((t) => /^[0-9a-f]{12}$/.test(t)));
    if (typeof applyListening === "function") applyListening();

    const q = state.queue || [];
    $("queue").innerHTML = q.length ? q.map((t, i) => {
      const th = safeUrl(t.thumb);
      return `<li class="q"><div class="thumb" style="${th ? `background-image:url('${th}')` : ""}"></div>
        <div style="min-width:0"><div class="title" style="font-size:15px">${i + 1}. ${t.kind && t.kind !== "track" ? (t.kind === "album" ? "Album: " : "Playlist: ") : ""}${esc(t.title)}</div>
        <div class="by">${t.locked ? "playing next · added by " + esc(t.by) : t.mine ? "added by you" : "added by " + esc(t.by)}</div></div>
        ${t.mine ? `<button type="button" class="remove" data-uid="${esc(t.uid)}">Remove</button>` : "<span></span>"}</li>`;
    }).join("") : `<li class="empty" style="display:block">No requests yet — add one!</li>`;
    tick();
  }

  function tick() {
    const n = state && state.now;
    if (!n || !n.duration) { $("progress").style.width = "0"; $("pos").textContent = $("dur").textContent = "0:00"; return; }
    const pos = Math.min(n.duration, n.position + (n.state === "playing" ? (Date.now() - fetchedAt) / 1000 : 0));
    $("progress").style.width = (100 * pos / n.duration) + "%";
    $("pos").textContent = fmt(pos); $("dur").textContent = fmt(n.duration);
  }

  async function post(path, body) {
    const r = await fetch(API + path, { method: "POST", headers: { "Content-Type": "application/json", "X-Client": client }, body: JSON.stringify(body || {}) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || "Something went wrong.");
    return j;
  }

  const isLink = (v) => /open\.spotify\.com\/|spotify:(track|playlist|album):/.test(v);
  let searchTimer = 0, searchSeq = 0, lastResults = [];

  async function runSearch(q) {
    const seq = ++searchSeq;
    if (q.length < 2) { $("results").innerHTML = ""; return; }
    try {
      const r = await fetch(API + "api/search?q=" + encodeURIComponent(q), { cache: "no-store" });
      const j = await r.json();
      if (seq !== searchSeq) return;
      if (!r.ok || j.error) { say(j.error || "Search failed.", "err"); return; }
      say("", "");
      lastResults = j.results || [];
      $("results").innerHTML = lastResults.length ? lastResults.map((t, i) => {
        const th = safeUrl(t.art);
        return `<li><div class="thumb" style="${th ? `background-image:url('${th}')` : ""}"></div>
          <div style="min-width:0"><div class="title" style="font-size:15px">${esc(t.title)}</div>
          <div class="by">${esc(t.artist)}</div></div>
          <button type="button" data-i="${i}">Add</button></li>`;
      }).join("") : `<li class="empty" style="display:block">No songs found.</li>`;
    } catch (e) { if (seq === searchSeq) say("Search failed.", "err"); }
  }

  $("url").addEventListener("input", () => {
    const v = $("url").value.trim();
    clearTimeout(searchTimer);
    if (!state || !state.search || isLink(v)) { $("results").innerHTML = ""; return; }
    searchTimer = setTimeout(() => runSearch(v), 350);
  });

  $("results").addEventListener("click", async (e) => {
    const b = e.target.closest("button[data-i]");
    if (!b) return;
    const t = lastResults[+b.dataset.i];
    b.disabled = true;
    try {
      await post("api/request", { url: "spotify:track:" + t.id, title: t.title + " — " + t.artist, thumb: t.art, name: $("name").value });
      $("url").value = ""; $("results").innerHTML = ""; say("Added to the queue 🎶", "ok");
      refresh();
    } catch (err) { say(err.message, "err"); b.disabled = false; }
  });

  $("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const url = $("url").value.trim();
    if (!url) return;
    if (state && state.search && !isLink(url)) { clearTimeout(searchTimer); runSearch(url); return; }
    $("addBtn").disabled = true;
    try {
      await post("api/request", { url, name: $("name").value });
      $("url").value = ""; say("Added to the queue 🎶", "ok");
      refresh();
    } catch (err) { say(err.message, "err"); }
    finally { $("addBtn").disabled = !(state && state.requests); }
  });

  async function vote(path, btn, doneText) {
    btn.disabled = true;
    try {
      const j = await post(path);
      say(j.done ? doneText : `Vote counted — ${j.votes}/${j.needed}. Waiting for others.`, "ok");
    } catch (err) { say(err.message, "err"); }
    setTimeout(refresh, 600);
  }
  $("nextBtn").addEventListener("click", () => vote("api/next", $("nextBtn"), "Skipped ⏭"));
  $("toggleBtn").addEventListener("click", () =>
    vote("api/toggle", $("toggleBtn"), state && state.now && state.now.state === "playing" ? "Paused ⏸" : "Resumed ▶"));

  $("queue").addEventListener("click", async (e) => {
    const b = e.target.closest("button[data-uid]");
    if (!b) return;
    b.disabled = true;
    try { await post("api/remove", { uid: b.dataset.uid }); say("Removed from the queue.", "ok"); refresh(); }
    catch (err) { say(err.message, "err"); b.disabled = false; }
  });

  if (!SECRET && location.hostname.endsWith(".github.io")) {
    $("title").textContent = "This link is missing its code"; $("artist").textContent = "Ask for the full link (it ends with #…).";
  }
  // Live audio: native HLS where supported (Safari, iOS), hls.js elsewhere.
  try { vol = parseFloat(localStorage.getItem("jbVol") || "0.8"); } catch (e) {}
  $("vol").value = vol;
  $("vol").addEventListener("input", () => {
    vol = parseFloat($("vol").value);
    if (audio) audio.volume = vol;
    try { localStorage.setItem("jbVol", vol); } catch (e) {}
  });
  const loadHls = () => window.Hls ? Promise.resolve() : new Promise((ok, fail) => {
    const sc = document.createElement("script");
    sc.src = "https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js";
    sc.onload = ok; sc.onerror = fail; document.head.appendChild(sc);
  });
  function stopListening(msg) {
    if (beatTimer) {
      clearInterval(beatTimer); beatTimer = 0;
      post("api/listening", { stop: true }).then(refresh).catch(() => {});
    }
    if (hls) { hls.destroy(); hls = null; }
    if (audio) { audio.pause(); audio.removeAttribute("src"); audio.load(); audio = null; }
    $("listenBtn").textContent = "🎧 Listen";
    if (msg) $("listenHint").textContent = msg;
  }
  async function startListening() {
    const src = API + "live.m3u8";
    audio = new Audio();
    audio.volume = vol;
    $("listenBtn").textContent = "⏹ Stop";
    $("listenHint").textContent = "Connecting…";
    try {
      if (audio.canPlayType("application/vnd.apple.mpegurl")) {
        audio.src = src;
      } else {
        await loadHls();
        if (!window.Hls || !Hls.isSupported()) throw new Error("This browser can't play the stream.");
        hls = new Hls({ liveSyncDurationCount: 2, manifestLoadingMaxRetry: 6, levelLoadingMaxRetry: 6 });
        hls.on(Hls.Events.ERROR, (_, d) => { if (d.fatal) stopListening("Lost the stream — press Listen to retry."); });
        hls.loadSource(src);
        hls.attachMedia(audio);
      }
      await audio.play();
      $("listenHint").textContent = "Listening live 🎶";
      beat(); beatTimer = setInterval(beat, 10000);
    } catch (err) { stopListening(err.message || "Couldn't start the stream."); }
  }
  $("listenBtn").addEventListener("click", () => audio ? stopListening("Stopped.") : startListening());

  resolveAPI().then(refresh);
  setInterval(refresh, 2500);

  // Live chat: poll for new messages every 1.5 s.
  let chatLast = 0, chatFirst = 0, chatBusy = false;
  let listeningTags = new Set();
  function applyListening() {
    document.querySelectorAll("#chatlog .cm[data-tag]").forEach((el) => {
      el.classList.toggle("listening", !!el.dataset.tag && listeningTags.has(el.dataset.tag));
    });
  }
  const chatSay = (text, kind) => { $("chatMsg").textContent = text; $("chatMsg").className = "msg " + (kind || ""); };
  function renderMsg(m) {
    const t = new Date(m.time).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    if (m.kind === "system") return `<div class="cm system">${esc(m.text)}</div>`;
    const tag = /^[0-9a-f]{12}$/.test(m.tag || "") ? m.tag : "";
    const live = tag && listeningTags.has(tag) ? " listening" : "";
    return `<div class="cm ${m.kind}${m.mine ? " mine" : ""}${live}" data-tag="${tag}"><b>${esc(m.name)}${m.kind === "host" ? " · host" : ""}</b><span class="ear" title="Listening now">🎧 listening</span>${esc(m.text)}<time>${t}</time></div>`;
  }
  async function pollChat() {
    if (chatBusy || (SECRET && !API)) return;
    chatBusy = true;
    try {
      const r = await fetch(API + "api/chat?after=" + chatLast, { cache: "no-store", headers: { "X-Client": client } });
      if (!r.ok) return;
      const j = await r.json();
      $("chatCard").hidden = !j.enabled;
      const log = $("chatlog");
      // Host cleared the chat, or MixMic restarted: start over.
      if (j.last < chatLast || (chatFirst && j.first > chatFirst)) {
        log.innerHTML = '<div class="cm system" id="chatEmpty">No messages yet — say hi.</div>';
        chatLast = 0; chatFirst = 0;
        chatBusy = false; return pollChat();
      }
      const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 60;
      for (const m of j.messages) {
        if (m.id <= chatLast) continue;
        const empty = $("chatEmpty"); if (empty) empty.remove();
        log.insertAdjacentHTML("beforeend", renderMsg(m));
        chatLast = m.id;
        if (!chatFirst) chatFirst = m.id;
      }
      while (log.children.length > 200) log.firstElementChild.remove();
      if (atBottom) log.scrollTop = log.scrollHeight;
    } catch (e) {} finally { chatBusy = false; }
  }
  $("chatText").addEventListener("input", () => chatSay("", ""));
  $("chatForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = $("chatText").value.trim();
    if (!text) { chatSay("Type a message first.", "err"); return; }
    $("chatSend").disabled = true;
    try {
      await post("api/chat", { text, name: $("name").value });
      $("chatText").value = "";
      await pollChat();
      $("chatlog").scrollTop = $("chatlog").scrollHeight;
    } catch (err) { chatSay(err.message, "err"); }
    finally { $("chatSend").disabled = false; }
  });
  setInterval(pollChat, 1500);
  setInterval(tick, 500);
</script>
</body>
</html>
